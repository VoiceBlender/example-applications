# Docker Compose example for the VoiceBlender contact-centre and push-to-talk apps.
#
# Both apps talk to ONE VoiceBlender — the existing server on the host. They stay
# out of each other's way with `app_id`: every room and browser leg they create is
# tagged with it, and each filters the VSI event stream down to its own. See
# APP_ID below and each app's README.
#
# Topology:
#
# Caddy fronts BOTH apps on the same ports (80/443) and routes by HOSTNAME:
#
#     http://localhost/           →  contact-centre   (catch-all site)
#     http://ptt.localhost/       →  ptt              (named site)
#
#     browser                        browser
#        │ http://localhost             │ http://ptt.localhost
#        │ (or https://$CADDY_DOMAIN)   │ (or https://$CADDY_PTT_DOMAIN)
#        ▼                              ▼
#     ┌───────────────────────────────────────────┐
#     │            caddy (80 / 443)               │
#     │       routes by Host header, not port     │
#     └────────┬────────────────────────┬─────────┘
#              │ contact-centre:8090    │ ptt:8092
#              ▼                        ▼
#     ┌─────────────────┐      ┌─────────────────┐
#     │  contact-centre │      │       ptt       │
#     │  app_id=        │      │  app_id=ptt     │
#     │  contact-centre │      │                 │
#     └────────┬────────┘      └────────┬────────┘
#              │                        │
#              │   ┌────────────────────┘
#              ▼   ▼
#     ┌─────────────────┐      ┌────────────────────────────────┐
#     │      redis      │      │ VoiceBlender (on the host)      │
#     │  db 0: call log │      │ host.docker.internal:8080       │
#     │  db 1: ptt      │      │ …shared by BOTH apps            │
#     └─────────────────┘      └────────────────────────────────┘
#
# Every environment variable the apps accept is listed below — uncomment
# and tweak as needed. Sensible defaults are set; `letmein` passwords
# are placeholders, change them before running anywhere shared.
#
# Quick start:
#
#     docker compose up --build              # binds host :80 and :443
#
# Already got something on host :80? Pick alternative ports:
#
#     CADDY_HTTP_PORT=8090 CADDY_HTTPS_PORT=8443 docker compose up --build
#
#   …then reach the apps at http://localhost:8090/ and http://ptt.localhost:8090/.
#
# With the Redis-backed call log for the contact centre:
#
#     CALL_LOG_BACKEND=redis docker compose up --build
#
# With HTTPS via Let's Encrypt (public host, DNS for BOTH names pointing at it):
#
#     CADDY_DOMAIN=cc.example.com \
#       CADDY_PTT_DOMAIN=ptt.example.com \
#       CADDY_ACME_EMAIL=admin@example.com \
#       HOLD_MUSIC_URL=https://cc.example.com/moh/new_music.mp3 \
#       docker compose up --build -d
#
# Visit:
#   http://localhost/              supervisor panel   (via Caddy, local HTTP)
#   http://localhost/agent         agent panel        (via Caddy, local HTTP)
#   http://ptt.localhost/          push-to-talk       (via Caddy, local HTTP)
#   https://<CADDY_DOMAIN>/        supervisor panel   (Let's Encrypt cert)
#   https://<CADDY_PTT_DOMAIN>/    push-to-talk       (Let's Encrypt cert)
#
# Networking notes:
# - VOICEBLENDER_URL points at a VoiceBlender server on the *host* via
#   `host.docker.internal`. If you run VoiceBlender in another
#   container, replace it with that service's hostname. BOTH apps point at
#   the same one on purpose.
# - HOLD_MUSIC_URL is the URL VoiceBlender will fetch the hold-music
#   file from, so it must be reachable from VoiceBlender's network.
#   With VoiceBlender on the host and Caddy published on :80,
#   host.docker.internal works (Caddy proxies through to the app).
# - Neither app publishes a host port of its own; Caddy fronts both. They're
#   reachable inside the compose network as `contact-centre:8090` and
#   `ptt:8092`. To poke at one directly, `docker compose exec ptt
#   wget -qO- http://localhost:8092/login` or add a `ports:` entry.
# - ptt needs a microphone, and browsers only grant one in a *secure context*.
#   `localhost` and `*.localhost` count (the browser resolves them to 127.0.0.1
#   itself — no /etc/hosts entry needed), which is why the default hostname is
#   `ptt.localhost`. Any other plain-HTTP hostname does NOT count, so reaching
#   it over the network needs HTTPS — set CADDY_PTT_DOMAIN to a real name.
# - redis is no longer opt-in: ptt requires it. The contact centre still keeps
#   its call log in memory unless you set CALL_LOG_BACKEND=redis.

services:
  contact-centre:
    build: .
    image: cc-example:latest
    container_name: cc-example
    # No host port mapping — Caddy fronts this service. Compose-internal
    # callers reach it as `contact-centre:8090`.
    expose:
      - "8090"
    environment:
      # ---------------------------------------------------- core ----------
      # VoiceBlender REST + VSI base URL. The app derives the WebSocket
      # URL from this (http→ws, https→wss; appends /vsi).
      VOICEBLENDER_URL: "http://host.docker.internal:8080/v1"
      # Address the app's HTTP server binds inside the container. Change
      # the published port below to match if you change this.
      LISTEN_ADDR: ":8090"
      # Identifies this app on the shared VoiceBlender. Its rooms and browser
      # (agent / supervisor) legs are tagged with it, and its VSI event stream
      # is filtered to it, so the ptt app's traffic never reaches it.
      APP_ID: "${CC_APP_ID:-contact-centre}"
      # The filter also accepts events with NO app_id, because an inbound SIP
      # call is only tagged when its INVITE carries an `X-App-ID` header — an
      # ordinary call is unattributed, and dropping it would mean the phone
      # never rings. If your SIP provider stamps X-App-ID on calls for this app,
      # set this to 1 to accept only tagged events. See cmd/contact-centre/README.md.
      # APP_ID_STRICT: "1"
      # URL VoiceBlender will fetch hold music from. Must be reachable
      # from VoiceBlender's network. With Caddy on the standard port 80
      # this is just plain `host.docker.internal/moh/...`. For production
      # HTTPS swap this for https://${CADDY_DOMAIN}/moh/new_music.mp3 so
      # the SIP fetcher goes through Caddy.
      HOLD_MUSIC_URL: "${HOLD_MUSIC_URL:-http://host.docker.internal/moh/new_music.mp3}"
      # How often the queue-position announcement loops.
      ANNOUNCEMENT_INTERVAL: "20s"
      # Codec preference order for answering inbound SIP calls (comma
      # separated). Applied to the 183 early-media SDP and the 200 OK
      # answer SDP. The app picks the first codec the caller actually
      # offered; if none match (or empty) VoiceBlender uses its default
      # order. Valid names: PCMU, PCMA, G722, opus.
      ANSWER_CODECS: "${ANSWER_CODECS:-}"
      # Privacy mask for caller numbers on the supervisor's view (only
      # — the agent panel always sees the real number). Modes:
      #   last4  keep only the last 4 digits, e.g. +********0123 (default)
      #   hidden replace the user part with "caller"
      #   full   disable masking (development / debugging)
      SUPERVISOR_CALLER_MASK: "${SUPERVISOR_CALLER_MASK:-last4}"

      # ----------------------------------------------------- TTS ----------
      TTS_VOICE: "Rachel"
      TTS_PROVIDER: "elevenlabs"
      # Optional if VoiceBlender already has the provider's API key.
      # TTS_API_KEY: "sk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

      # ----------------------------------------------------- STT ----------
      # Live transcription kicks in once an agent answers a call. The
      # supervisor panel shows transcripts in real time and persists
      # them in the call log.
      STT_LANGUAGE: "en"
      STT_PROVIDER: "elevenlabs"
      # STT_API_KEY: "sk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

      # ---------------------------------------------------- Transfer ------
      # How long a blind transfer rings before auto-failing and restoring
      # the customer to the original agent.
      TRANSFER_RING_TIMEOUT: "${TRANSFER_RING_TIMEOUT:-30s}"

      # -------------------------------------------------- KPIs / metrics --
      # Service-level threshold and the rolling window used for SL/ASA/
      # AHT/Abandon/Longest-Wait on the supervisor's Metrics board.
      SLA_THRESHOLD: "20s"
      METRICS_WINDOW: "30m"

      # ---------------------------------------------------- Auth ----------
      # Static passwords that gate the supervisor and agent panels.
      # Leave a value empty (or unset) to disable auth for that side.
      # Only the password is validated; the username on the login form
      # is free-form and used as the agent's display name.
      SUPERVISOR_PASSWORD: "${SUPERVISOR_PASSWORD:-letmein}"
      AGENT_PASSWORD: "${AGENT_PASSWORD:-letmein}"

      # -------------------------------------------------- Call log --------
      # "memory" (default) → in-process ring buffer (lost on restart).
      # "redis"            → any Redis-compatible server (see profile).
      CALL_LOG_BACKEND: "${CALL_LOG_BACKEND:-memory}"
      CALL_LOG_MAX: "200"
      # Pointed at the in-compose Redis service below when the redis
      # profile is active. Override these to use an external Redis.
      CALL_LOG_REDIS_URL: "${CALL_LOG_REDIS_URL:-redis://redis:6379/0}"
      CALL_LOG_REDIS_KEY: "${CALL_LOG_REDIS_KEY:-contactcentre:call_log}"
    extra_hosts:
      # Linux needs this so host.docker.internal resolves; macOS / Windows
      # do it natively but the line is harmless on those platforms.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/login"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ------------------------------------------------------ push-to-talk ----
  # Browser walkie-talkie. Talks to the SAME VoiceBlender as the contact
  # centre above; `app_id` is what keeps the two apart on the shared VSI
  # event stream. Requires Redis (users, sessions and rooms live there).
  ptt:
    build:
      context: .
      dockerfile: Dockerfile.ptt
    image: ptt-example:latest
    container_name: ptt-example
    # No host port mapping — Caddy fronts this service too.
    expose:
      - "8092"
    environment:
      # The *same* VoiceBlender the contact centre uses. That's the point:
      # one media server, two apps, separated by app_id.
      VOICEBLENDER_URL: "http://host.docker.internal:8080/v1"
      LISTEN_ADDR: ":8092"
      # Identifies this app on the shared VoiceBlender. Every room AND every
      # browser leg it creates is tagged with this, and it subscribes to the VSI
      # stream with a `^ptt$` filter — so it sees only its own events, and the
      # contact centre never sees its traffic.
      APP_ID: "${PTT_APP_ID:-ptt}"
      # Redis is required. Its own database (1) keeps its keys away from the
      # contact centre's call log in database 0.
      REDIS_URL: "${PTT_REDIS_URL:-redis://redis:6379/1}"
      # Log every raw VSI frame (commands sent / events received). On by
      # default — handy for watching app_id isolation actually work. Set to 0
      # to silence.
      VSI_LOG: "${VSI_LOG:-1}"
    extra_hosts:
      # Linux needs this so host.docker.internal resolves.
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/login"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------- Caddy front-end --
  # Reverse proxy on the user-facing port. Reverse_proxy in Caddy v2
  # handles WebSocket upgrades transparently, so /api/calls/stream and
  # /api/agent/stream work without extra config. Edit ./Caddyfile to
  # switch to HTTPS (real domain → automatic Let's Encrypt) or to add
  # headers, basic auth, rate limits, etc.
  caddy:
    image: caddy:2-alpine
    container_name: cc-caddy
    # Two ports published. Defaults are the standard 80 / 443 so the
    # stack is Let's-Encrypt-ready out of the box. Override if you've
    # already got something on those host ports (e.g.
    # `CADDY_HTTP_PORT=8090 CADDY_HTTPS_PORT=8443 docker compose up`).
    # Both apps share these ports. Caddy tells them apart by hostname, so no
    # extra port is published for push-to-talk.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # Unset / empty CADDY_DOMAIN → falls through to `http://:80`,
      # which makes Caddy serve plain HTTP. Set a real domain (e.g.
      # cc.example.com) → Caddy auto-issues a Let's Encrypt cert and
      # serves HTTPS. Defaults below are duplicated from the Caddyfile
      # so empty env values still produce a valid configuration.
      CADDY_DOMAIN: "${CADDY_DOMAIN:-http://:80}"
      # Push-to-talk is a second site on the SAME ports, told apart by hostname.
      # The default `ptt.localhost` resolves to 127.0.0.1 in the browser and
      # counts as a secure context, so the microphone works over plain HTTP.
      # Anywhere else it won't — set a real hostname (e.g. ptt.example.com) and
      # Caddy serves it over HTTPS on 443 next to CADDY_DOMAIN.
      CADDY_PTT_DOMAIN: "${CADDY_PTT_DOMAIN:-http://ptt.localhost}"
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:-no-reply@example.invalid}"
      CADDY_ACME_CA: "${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      contact-centre:
        condition: service_started
      ptt:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------------------- Redis sidecar ----
  # Always on: the ptt app requires Redis (it stores users, sessions and rooms
  # there), so this is no longer behind the `redis` profile. It also backs the
  # contact centre's call log when CALL_LOG_BACKEND=redis — that stays opt-in,
  # and the two apps use separate databases (call log → 0, ptt → 1).
  redis:
    image: redis:7-alpine
    container_name: cc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  redis-data:
